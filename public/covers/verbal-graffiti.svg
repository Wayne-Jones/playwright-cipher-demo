<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f0f2c"/>
    <stop offset="100%" stop-color="#c5ff3d"/>
  </linearGradient>
</defs>
<rect width="600" height="600" fill="url(#bg)"/>
<circle cx="300" cy="300" r="250" fill="none" stroke="#ff2e9a" stroke-width="10" opacity="0.55"/>
<circle cx="300" cy="300" r="205" fill="none" stroke="#ff2e9a" stroke-width="6" opacity="0.4"/>
<circle cx="300" cy="300" r="160" fill="none" stroke="#ff2e9a" stroke-width="3" opacity="0.3"/>
<rect x="24" y="24" width="552" height="552" fill="none" stroke="#000" stroke-width="6" opacity="0.6"/>
<defs>
<filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
  <feOffset dx="3" dy="3" result="shadow"/>
  <feComposite in="blur" in2="shadow" operator="over" result="shadow2"/>
  <feMerge>
    <feMergeNode in="SourceGraphic"/>
    <feMergeNode in="shadow2"/>
  </feMerge>
</filter>
</defs>
<text x="44" y="70" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#000" opacity="0.75">[ PLATINUM RHYMES ]</text>
<g filter="url(#bevel)" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif">
  <text x="300" y="295" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="2" fill="#fff" stroke="#000" stroke-width="1.5" paint-order="stroke">VERBAL G</text>
  <text x="300" y="303" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="2" fill="none" stroke="#fff" stroke-width="1" opacity="0.35">VERBAL G</text>
</g>
<g filter="url(#bevel)" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif">
  <text x="300" y="353" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="2" fill="#fff" stroke="#000" stroke-width="1.5" paint-order="stroke">RAFFITI</text>
  <text x="300" y="361" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="2" fill="none" stroke="#fff" stroke-width="1" opacity="0.35">RAFFITI</text>
</g>
<g font-family="'Courier New', monospace">
<text x="44" y="556" font-size="24" font-weight="700" fill="#000" opacity="0.8">MC INFINITY · 1994</text>
<text x="556" y="556" text-anchor="end" font-size="24" font-weight="700" fill="#000" opacity="0.8">★★★★★</text>
</g>
</svg>