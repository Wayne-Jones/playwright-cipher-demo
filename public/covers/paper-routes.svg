<rect x="24" y="24" width="552" height="552" fill="none" stroke="#000" stroke-width="6" opacity="0.6"/>
<defs>
<filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
  <feOffset dx="3" dy="3" result="shadow"/>
  <feComposite in="blur" in2="shadow" operator="over" result="shadow2"/>
  <feMerge>
    <feMergeNode in="SourceGraphic"/>
    <feMergeNode in="shadow2"/>
  </feMerge>
</filter>
</defs>
<text x="44" y="70" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#000" opacity="0.75">[ GREEN INK ]</text>
